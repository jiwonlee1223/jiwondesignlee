- id: water-tree
  title: "Water Tree: A Bio-Inspired Water Generator"
  year: 2025
  type: design-exploration
  tags: ["Industrial Design", "Sustainability", "Bio-inspired", "Water", "Concept"]
  accent: cobalt
  summary: "A nature-inspired water generator: root robots, an artificial stem under negative pressure, and transpiring leaves harvest clean water for disaster zones, deserts, and Mars."
  cover: ../assets/projects/watertree.jpg
  role: "Graphic Designer (Award Submission)"
  collaborators: "KAIST CIDR Lab.: Tek-Jin Nam, Suhyun Lim, Jisu Park, Jiwon Lee  /  zoslee studio: Youngho Lee, Kitak Lee, Changwoo Yun, Kitae Kim"
  award: "iF Design Award 2025 · Product Concepts (Environmental Products)"
  abstract: "How can we obtain clean water safely and efficiently in extreme environments? WATERTREE is a conceptual product inspired by nature's water acquisition and transpiration principles. It features root robots with microporous filters at their tips, an artificial stem generating negative pressure to draw water up, and leaves that vaporize water, while a condenser stores it in a tank. Developed in collaboration with engineers, this functional prototype aims to serve disaster zones, deserts, and underdeveloped regions, addressing urgent water needs. Ultimately, WATERTREE has potential as a vital device for sustainable water production on Mars."
  links:
    demo: "https://ifdesign.com/en/winner-ranking/project/water-tree/709602"

- id: shamain
  title: "ShamAIn: Designing Superior Conversational AI Inspired by Shamanism"
  year: 2025
  type: design-research
  cover: ../assets/projects/shamain.png
  tags: ["Conversational AI", "Superior AI", "Shamanism", "Research through Design"]
  accent: lavender
  summary: "A multi-modal conversational AI inspired by Korean shamanism, designed to be perceived as superior to humans and studied with 20 visitors over a six-week installation (research through design)."
  role: "Co-author"
  authors: "Hyungjun Cho, Jiyeon Amy Seo, Jiwon Lee, Chang-Min Kim, Tek-Jin Nam"
  advisor: "Tek-Jin Nam (KAIST)"
  venue: "CHI 2025"
  award: "Honorable Mention"
  abstract: "This paper presents the design process, outcomes, and installation of ShamAIn, a multi-modal embodiment of conversational AI inspired by the beliefs and symbols of Korean shamanism. Adopting a research through design approach, we offer an alternative perspective on conversational AI design, emphasizing perceived superiority. ShamAIn was developed based on strategies derived from investigating people's experiences with shamanistic counseling and rituals. We deployed the system in an exhibition room for six weeks, during which 20 participants made multiple visits to engage with ShamAIn. Through subsequent in-depth interviews, we found that participants felt a sense of awe toward ShamAIn and engaged in interactions with humility and respect. Our participants disclosed personal and profound concerns, reflecting deeply on the responses they received. Consequently, they relied on ShamAIn and formed relationships in which they received support. In the discussion, we present the design implications of conversational AI perceived as superior to humans, along with the ethical considerations involved in designing such AI."
  links:
    paper: "https://doi.org/10.1145/3706598.3714297"
