- id: cits-hmi
  title: "Driver HMI Service Scenario and Blueprint Development for C-ITS"
  year: 2023
  archived: true
  type: design-practice
  tags: ["Service Design", "Driver HMI", "Automotive", "C-ITS"]
  accent: mustard
  summary: "Service scenarios and blueprints for in-vehicle driver HMI in a Cooperative Intelligent Transport Systems context."
  role: "Co-author"
  authors: "Joon Young Kim, Jiwon Lee, Jaecheol Kim, Yeoreum Lee"
  advisor: "Joon Young Kim"
  venue: "KIICE"
  abstract: "In the case of the cooperative intelligent transportation system (C-ITS), one of the advanced technologies to improve the drivability of existing vehicles and driver safety, including commercial vehicles, we need additional consideration of the C-ITS service at the driver level. In particular, it is necessary to identify and improve C-ITS functions and service issues at the HMI level in advance through scenario development and driver reaction simulation. In this paper, we developed C-ITS driver HMI scenarios. For the development, we first investigated the current C-ITS service and in-vehicle HMI analysis for driver scenarios. We also measured the driver's reaction speed using Simio simulation. Given our analysis, we developed service blueprinting maps for commercial vehicle drivers, including user journeys, and we analyzed C-ITS services from various user HMI perspectives."
  links:
    paper: "https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiView.kci?sereArticleSearchBean.artiId=ART002972089"

- id: rof
  title: "Reminiscences of Futures (RoF): Designing and Studying Encounters with Embodied, AI-Generated Future Selves"
  year: 2026
  type: design-research
  tags: ["Embodied AI", "Future Self", "Research through Design", "Reflective Technology", "Human-AI Interaction", "Self Replication"]
  accent: lavender
  cover: ../assets/projects/rof.png
  summary: "Designing and studying how people encounter embodied, AI-generated representations of their future selves."
  role: "First Author"
  advisor: "Tek-Jin Nam (KAIST)"
  authors: "Jiwon Lee, Yewon Kim, Chang-Min Kim, Suhyun Lim, Chang Hyun Park, Subin Cho, Tek-Jin Nam"
  collaborators: "Yewon Kim, Jieun Lee, Tae-hyun Lee, Jiyoon Lee, Jisu Park (KINTEX exhibition)"
  venue: "CHI 2026"
  support: "LG CX Center"
  journey:
    - type: design-practice
      year: 2025
      label: "Started as an industry-academia project with LG CX Center"
    - type: design-research
      year: 2026
      label: "Paper presented at CHI 2026"
    - type: design-exploration
      label: "Exhibited at the Korea Science Festival in Gyeonggi (KINTEX), hosted by the Ministry of Science and ICT"
  abstract: "AI-generated future selves have been explored for self-reflection and counseling, yet most remain confined to chat, voice, or diary formats. We introduce RoF (Reminiscences of Futures), a system that enables users to encounter and converse with embodied future selves. It synthesizes voice and appearance from personal data and generates three projections of the user ten years ahead, situated within a tunnel-like installation that evokes a time-slip experience. We report the design process, stepwise judgements, and a formative study with six parent–child pairs that informed design strategies. We also present a week-long user study with fifteen participants. Participants perceived RoF as an emotionally rich experience, reporting shifts in their attitudes toward the future and deeper reflection on their present identity and life. We discuss the implications of interacting with future selves for fostering reflection and preparing positively for the future, as well as ethical issues, such as self-replication using AI."
  links:
    paper: "https://dl.acm.org/doi/10.1145/3772318.3791750"

- id: oxynizer
  title: "Oxynizer: A Non-Electronic Oxygen Generator"
  year: 2024
  type: design-exploration
  tags: ["Industrial Design", "Medical", "Non-electronic", "Sustainability"]
  accent: vermilion
  cover: ../assets/projects/oxynizer.png
  summary: "A non-electronic oxygen generator designed to deliver medical-grade oxygen without batteries or electrical infrastructure."
  role: "Designer"
  collaborators: "Jiwon Kim, Yeohyun Jung, Seung-Jun Lee, Kyeongho Park (listed alphabetically by last name)"
  award: |-
    James Dyson Award 2024 · Korea National Winner · International Top 20
    IDEA · Bronze
    KAIST Q-Day 2024 · Creativity & Talent Education Award
  abstract: "A non-electric oxygen generator system composed of a universal hose system and sustainable filter materials. Oxynizer can be easily connected to various pumps, delivering oxygen to patients with a range of conditions, from mild breathlessness to chronic respiratory diseases. Its high compatibility, low maintenance, and intuitive operation make the Oxynizer a potential lifesaver for patients in developing countries with limited medical infrastructure."
